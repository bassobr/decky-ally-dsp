# Keeps build-time npm dependencies, the SHA-pinned GitHub Actions and the
# converter submodule fresh. Security updates open PRs immediately; regular
# version updates are grouped weekly to limit PR noise for a solo-maintained repo.
version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      npm-dependencies:
        patterns:
          - "*"
    ignore:
      # TypeScript 7 drops options the Decky rollup toolchain still relies on; stay on 5.x until @decky/rollup moves.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      actions:
        patterns:
          - "*"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
