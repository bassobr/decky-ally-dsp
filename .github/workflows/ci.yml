name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm audit --prod --audit-level=high
      - name: Backend syntax and tests
        run: |
          python3 -m compileall -q main.py py_modules/allydsp
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q
          bash -n install.sh scripts/*.sh
      - name: Assemble runtime pieces (converter, LV2 bundle)
        run: |
          scripts/assemble-converter.sh
          sudo apt-get install -y -qq zstd >/dev/null
          scripts/fetch-lsp.sh
      - name: Package (unsigned, artifact only)
        run: scripts/package.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-zip-unsigned
          path: |
            out/ally-dsp-*.zip
            out/SHA256SUMS
