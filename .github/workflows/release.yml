name: Release
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
# Least privilege: read-only token everywhere; only the release job gets contents: write.
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          submodules: true
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.11"
      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(python3 -c "import json;print(json.load(open('package.json'))['version'])")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match package.json version $V" >&2; exit 1
          fi
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run typecheck
      - run: pnpm audit --prod --audit-level=high
      - name: Backend syntax and tests
        run: |
          python3 -m compileall -q main.py py_modules/allydsp
          python3 -m pip install --quiet pytest
          python3 -m pytest tests/ -q
          bash -n install.sh scripts/*.sh
      - name: Assemble runtime pieces (converter, LV2 bundle)
        run: |
          scripts/assemble-converter.sh
          sudo apt-get install -y -qq zstd >/dev/null
          scripts/fetch-lsp.sh
      - name: Package
        run: scripts/package.sh
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: plugin-zip
          path: |
            out/ally-dsp-*.zip
            out/SHA256SUMS
  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: plugin-zip
      # Sign SHA256SUMS with the release seed (repo secret) and verify against the
      # committed public key, so a seed/pubkey mismatch fails the release instead
      # of shipping a signature no client would accept.
      - name: Sign SHA256SUMS
        env:
          MINISIGN_SEED: ${{ secrets.MINISIGN_SEED }}
        run: |
          PYTHONPATH=py_modules python3 -m allydsp.minisign sign SHA256SUMS --pub minisign.pub \
            --trusted-comment "ally-dsp ${GITHUB_REF_NAME}"
          PYTHONPATH=py_modules python3 -m allydsp.minisign verify SHA256SUMS SHA256SUMS.minisig minisign.pub
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" ally-dsp-*.zip SHA256SUMS SHA256SUMS.minisig \
            --repo "${GITHUB_REPOSITORY}" --title "${GITHUB_REF_NAME}" --generate-notes
